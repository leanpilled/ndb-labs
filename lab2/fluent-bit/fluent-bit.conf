[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name           tail
    Path           /var/log/nginx/access.json.log
    Tag            nginx.access
    Parser         json
    Refresh_Interval 2
    Read_from_Head true

[OUTPUT]
    Name            opensearch
    Match           nginx.access
    Host            os-hot1
    Port            9200
    Index           logs
    Write_Operation create
    Suppress_Type_Name On
    tls             On
    tls.verify      On
    tls.ca_file     /certs/root-ca.pem
    HTTP_User       writer_user
    HTTP_Passwd     ${WRITER_PASSWORD}
    Trace_Error     On
