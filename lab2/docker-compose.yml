name: lab2-opensearch

x-opensearch-common: &opensearch-common
  build:
    context: .
    dockerfile: opensearch.Dockerfile
    args:
      OPENSEARCH_VERSION: ${OPENSEARCH_VERSION}
  image: lab2-opensearch-prometheus:${OPENSEARCH_VERSION}
  environment: &opensearch-common-env
    cluster.name: lab2-cluster
    OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    DISABLE_INSTALL_DEMO_CONFIG: "true"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  networks: [opensearch-net]
  volumes:
    - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
    - ./config/opensearch-security:/usr/share/opensearch/config/opensearch-security:ro
    - ./certs:/usr/share/opensearch/config/certs:ro

services:
  os-manager:
    <<: *opensearch-common
    container_name: os-manager
    environment:
      <<: *opensearch-common-env
      node.name: os-manager
      node.roles: cluster_manager
    volumes:
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./config/opensearch-security:/usr/share/opensearch/config/opensearch-security:ro
      - ./certs:/usr/share/opensearch/config/certs:ro
      - os-manager-data:/usr/share/opensearch/data

  os-hot1:
    <<: *opensearch-common
    container_name: os-hot1
    environment:
      <<: *opensearch-common-env
      node.name: os-hot1
      node.roles: data,ingest
      node.attr.temp: hot
    ports:
      - "9200:9200"
    volumes:
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./config/opensearch-security:/usr/share/opensearch/config/opensearch-security:ro
      - ./certs:/usr/share/opensearch/config/certs:ro
      - os-hot1-data:/usr/share/opensearch/data
    depends_on:
      - os-manager

  os-hot2:
    <<: *opensearch-common
    container_name: os-hot2
    environment:
      <<: *opensearch-common-env
      node.name: os-hot2
      node.roles: data,ingest
      node.attr.temp: hot
    volumes:
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./config/opensearch-security:/usr/share/opensearch/config/opensearch-security:ro
      - ./certs:/usr/share/opensearch/config/certs:ro
      - os-hot2-data:/usr/share/opensearch/data
    depends_on:
      - os-manager

  os-warm1:
    <<: *opensearch-common
    container_name: os-warm1
    environment:
      <<: *opensearch-common-env
      node.name: os-warm1
      node.roles: data
      node.attr.temp: warm
    volumes:
      - ./config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./config/opensearch-security:/usr/share/opensearch/config/opensearch-security:ro
      - ./certs:/usr/share/opensearch/config/certs:ro
      - os-warm1-data:/usr/share/opensearch/data
    depends_on:
      - os-manager

  # One-off job: (re-)applies config/opensearch-security/*.yml to the running
  # cluster via securityadmin.sh.
  security-init:
    <<: *opensearch-common
    container_name: security-init
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        for i in $(seq 1 30); do
          if /usr/share/opensearch/plugins/opensearch-security/tools/securityadmin.sh \
              -cd /usr/share/opensearch/config/opensearch-security \
              -icl -nhnv \
              -key /usr/share/opensearch/config/certs/admin-key.pem \
              -cert /usr/share/opensearch/config/certs/admin.pem \
              -cacert /usr/share/opensearch/config/certs/root-ca.pem \
              -h os-manager -p 9200; then
            echo "security-init: config applied"
            exit 0
          fi
          echo "security-init: cluster not ready yet, retry $$i/30"
          sleep 5
        done
        echo "security-init: FAILED after 30 attempts"
        exit 1
    depends_on:
      - os-manager
      - os-hot1
      - os-hot2
      - os-warm1

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION}
    container_name: opensearch-dashboards
    networks: [opensearch-net]
    ports:
      - "5601:5601"
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes:
      - ./config/dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
      - ./certs/root-ca.pem:/usr/share/opensearch-dashboards/certs/root-ca.pem:ro
    depends_on:
      - os-hot1
      - os-hot2
      - os-warm1

  nginx:
    image: nginx:stable
    container_name: nginx
    networks: [opensearch-net]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: fluent-bit
    networks: [opensearch-net]
    environment:
      WRITER_PASSWORD: "${WRITER_PASSWORD}"
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - nginx-logs:/var/log/nginx:ro
      - ./certs/root-ca.pem:/certs/root-ca.pem:ro
    depends_on:
      - nginx
      - os-hot1

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lab2-prometheus
    networks: [opensearch-net]
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/secrets/monitor_password.txt:/run/secrets/monitor_password.txt:ro
      - ./certs/root-ca.pem:/certs/root-ca.pem:ro
      - prometheus-data:/prometheus
    depends_on:
      - os-hot1

  grafana:
    image: grafana/grafana:11.2.0
    container_name: lab2-grafana
    networks: [opensearch-net]
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  opensearch-net:
    driver: bridge

volumes:
  os-manager-data:
  os-hot1-data:
  os-hot2-data:
  os-warm1-data:
  nginx-logs:
  prometheus-data:
  grafana-data:
