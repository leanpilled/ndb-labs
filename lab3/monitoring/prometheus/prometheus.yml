global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: fastapi-app
    static_configs:
      - targets:
          - app1:8000
          - app2:8000
          - app3:8000
        labels:
          service: cache-app

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
